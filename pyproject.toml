[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "flocking-aesthetics-mcp"
version = "0.1.0"
description = "MCP server mapping flocking behavior patterns to aesthetic parameter space"
authors = [
    {name = "Dal Marsters", email = "dal@lushy.app"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
